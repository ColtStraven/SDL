[package]
name = "sdl-replay-decoder"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
